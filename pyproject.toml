[project]
name = "cs2-analytics"
version = "1.0.0"
description = "CS2 gameplay-analysis backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.8",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "google-genai>=2.0.0,<3.0.0",
    "yt-dlp>=2026.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
